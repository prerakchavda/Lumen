name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0-beta)'
        required: true
        default: 'v0.1.0-beta'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.SEERFLIX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/seerflix-release.jks
            echo "SEERFLIX_KEYSTORE_PATH=/tmp/seerflix-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests & build release APK
        env:
          SEERFLIX_KEYSTORE_PASSWORD: ${{ secrets.SEERFLIX_KEYSTORE_PASSWORD }}
          SEERFLIX_KEY_ALIAS: ${{ secrets.SEERFLIX_KEY_ALIAS }}
          SEERFLIX_KEY_PASSWORD: ${{ secrets.SEERFLIX_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Stage versioned APK
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.tag }}"
          fi
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/seerflix-tv-${TAG_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          name: Seerflix TV ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') || contains(github.event.inputs.tag, 'beta') }}
          generate_release_notes: true
          files: release-assets/seerflix-tv-*.apk
