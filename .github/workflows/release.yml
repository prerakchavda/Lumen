name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0); must match versionName in app/build.gradle.kts'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check tag matches versionName
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.tag }}"
          fi
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/p' app/build.gradle.kts | head -n1)
          # An APK that reports an older version than its tag makes the in-app updater offer
          # the same update forever.
          # Pre-release tags (v1.1.0-beta2) may carry a suffix versionName doesn't have.
          TAG_VERSION="${TAG_NAME#v}"
          if [ "$TAG_VERSION" != "$VERSION_NAME" ] && [ "${TAG_VERSION%%-*}" != "$VERSION_NAME" ]; then
            echo "::error::Tag $TAG_NAME does not match versionName $VERSION_NAME in app/build.gradle.kts"
            exit 1
          fi

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SEERFLIX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > /tmp/seerflix-release.jks
            echo "SEERFLIX_KEYSTORE_PATH=/tmp/seerflix-release.jks" >> "$GITHUB_ENV"
          else
            # A release without the release key would be signed with this runner's throwaway
            # debug key: it can't install over the previous release (in-app updater fails).
            echo "::error::SEERFLIX_KEYSTORE_BASE64 is not set; refusing to publish a debug-signed release."
            exit 1
          fi

      - name: Run unit tests & build release APK
        env:
          SEERFLIX_KEYSTORE_PASSWORD: ${{ secrets.SEERFLIX_KEYSTORE_PASSWORD }}
          SEERFLIX_KEY_ALIAS: ${{ secrets.SEERFLIX_KEY_ALIAS }}
          SEERFLIX_KEY_PASSWORD: ${{ secrets.SEERFLIX_KEY_PASSWORD }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        run: ./gradlew testDebugUnitTest lintRelease assembleRelease

      - name: Stage versioned APK
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.tag }}"
          fi
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk "release-assets/lumen-tv-${TAG_NAME}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          name: Lumen TV ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') || contains(github.event.inputs.tag, 'beta') }}
          generate_release_notes: true
          files: release-assets/lumen-tv-*.apk
